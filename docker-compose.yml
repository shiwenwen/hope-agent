# Hope Agent — official docker-compose example.
#
# Quick start:
#   1. docker compose up -d
#   2. Print the auto-generated owner token:
#      docker compose exec hope-agent hope-agent server token show
#   3. Open http://127.0.0.1:8420 and enter that token once.
#
# Enable Ollama sidecar for local LLMs:
#   docker compose --profile with-ollama up -d
#
# Expose to the LAN / public internet:
#   1. Keep the generated token, or set HA_API_KEY / HA_API_KEY_FILE.
#   2. Change the port mapping to "8420:8420" (drop the 127.0.0.1: prefix).
#   3. First visit asks for the token and exchanges it for an HttpOnly
#      browser session. Never put the root token in a URL.
#   For production use a TLS-terminating reverse proxy (Caddy / Nginx /
#   Traefik). See
#   docs/deployment/docker.md for full examples.

services:
  hope-agent:
    image: ghcr.io/shiwenwen/hope-agent:latest
    container_name: hope-agent
    restart: unless-stopped
    ports:
      # Default: loopback only. Docker still generates an owner token on
      # first boot, so changing this mapping never silently disables auth.
      - "127.0.0.1:8420:8420"
    environment:
      # HA_API_KEY optionally supplies an externally managed owner token.
      # When empty, Docker generates and stores one under /data/credentials.
      # Prefer HA_API_KEY_FILE with a mounted secret in production.
      HA_API_KEY: ${HA_API_KEY:-}
      TZ: ${TZ:-UTC}
    volumes:
      - hope-data:/data
      # Optional: enables `isolated` Docker sandbox mode for trusted local
      # deployments. The socket grants host-level Docker control. Before
      # uncommenting, set DOCKER_GID to `stat -c '%g' /var/run/docker.sock`.
      # Other sandbox modes remain fail-closed in container deployments because
      # a path inside this container is not a safe host bind-mount source.
      #- /var/run/docker.sock:/var/run/docker.sock
    #group_add:
    #  - "${DOCKER_GID}"

  ollama:
    image: ollama/ollama:latest
    container_name: hope-agent-ollama
    restart: unless-stopped
    profiles: [with-ollama]
    volumes:
      - ollama-models:/root/.ollama
    # Ollama is only reachable from the compose network — Hope Agent talks
    # to it via `http://ollama:11434/v1` (configure that URL inside the
    # browser onboarding wizard as a custom Provider). Uncomment the
    # `ports` block below to also expose Ollama on the host.
    #ports:
    #  - "127.0.0.1:11434:11434"
    #
    # NVIDIA GPU passthrough requires nvidia-container-toolkit on the host.
    # Uncomment the block below after installing it.
    #deploy:
    #  resources:
    #    reservations:
    #      devices:
    #        - driver: nvidia
    #          count: all
    #          capabilities: [gpu]

volumes:
  hope-data:
  ollama-models:
