[package]
name = "ha-skills"
version = "0.36.0"
description = "Hope Agent skill machinery — bundled-skill extraction, SKILL.md discovery/parsing, authoring, auto-review pipeline, @skill mentions, fork dispatch, the `skill` tool"
license.workspace = true
authors.workspace = true
repository.workspace = true
edition.workspace = true
build = "build.rs"

[dependencies]
ha-base = { path = "../ha-base" }
ha-config-schema = { path = "../ha-config-schema" }
ha-core = { path = "../ha-core" }

anyhow = { workspace = true }
blake3 = "1.8.5"
dirs = { workspace = true }
ignore = "0.4.25"
once_cell = { workspace = true }
regex = { workspace = true }
rust-embed = { version = "8", features = ["include-exclude"] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
ha-core = { path = "../ha-core", features = ["test-support"] }
tempfile = "3"

[lints]
workspace = true
