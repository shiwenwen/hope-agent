[package]
name = "ha-mcp"
version = "0.24.0"
description = "Hope Agent MCP client feature — McpManager registry, transports, OAuth, watchdog, mcp_resource/mcp_prompt tools"
license.workspace = true
authors.workspace = true
repository.workspace = true
edition.workspace = true

[dependencies]
ha-base = { path = "../ha-base" }
ha-config-schema = { path = "../ha-config-schema" }
ha-core = { path = "../ha-core" }

anyhow = { workspace = true }
arc-swap = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
futures-util = { workspace = true }
rand = { workspace = true }
reqwest = { workspace = true }
rmcp = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
sse-stream = { workspace = true }
tokio = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }

# 与 ha-core 原依赖同版本线
http = "1"
open = "5"
tokio-tungstenite = { version = "0.29", features = ["native-tls"] }
tokio-util = { version = "0.7", features = ["rt"] }

[lints]
workspace = true
