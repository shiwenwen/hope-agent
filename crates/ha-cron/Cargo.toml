[package]
name = "ha-cron"
version = "0.35.0"
description = "Hope Agent scheduling feature — cron scheduler, executor, delivery and manage_cron tool"
license.workspace = true
authors.workspace = true
repository.workspace = true
edition.workspace = true

[dependencies]
ha-base = { path = "../ha-base" }
ha-core = { path = "../ha-core" }

anyhow = { workspace = true }
chrono = { workspace = true }
futures-util = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
ha-core = { path = "../ha-core", features = ["test-support"] }
# 只在 `#[cfg(test)]` 里用（executor 的 fixture 自开 cron.db 连接、造 job id）。
rusqlite = { workspace = true }
tempfile = "3"
uuid = { workspace = true }

[lints]
workspace = true
