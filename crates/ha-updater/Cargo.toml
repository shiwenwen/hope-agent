[package]
name = "ha-updater"
version = "0.40.0"
description = "Hope Agent self-update — manifest check, signed download, atomic binary swap, app_update tool"
license.workspace = true
authors.workspace = true
repository.workspace = true
edition.workspace = true

[dependencies]
ha-base = { path = "../ha-base" }
ha-config-schema = { path = "../ha-config-schema" }
ha-core = { path = "../ha-core" }

anyhow = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
futures-util = { workspace = true }
minisign-verify = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }

# 裸二进制归档解包（与 ha-core 原依赖同版本线）
flate2 = "1"
tar = "0.4"
zip = "7"

# service_control：Unix uid 判定（launchctl / systemctl --user 目标用户）
libc = "0.2"

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"

[lints]
workspace = true
