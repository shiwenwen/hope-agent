[package]
name = "ha-improve"
version = "0.31.0"
description = "Hope Agent learning-loop feature — coding improvement proposals, domain eval fixtures and domain quality gates"
license.workspace = true
authors.workspace = true
repository.workspace = true
edition.workspace = true

[dependencies]
ha-core = { path = "../ha-core" }
ha-eval-spec = { path = "../ha-eval-spec" }

anyhow = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
ha-core = { path = "../ha-core", features = ["test-support"] }
# 只在 `#[cfg(test)]` 里用（gated 测试的 fixture 直接建表 / 塞行）。
rusqlite = { workspace = true }
tempfile = "3"
wiremock = "0.6"

[features]
# 与 ha-eval-runtime 同一接法：转发 ha-core 的同名开关，只由本地
# `hope-agent-eval` 显式打开，不进 PR 门禁。
eval-internal-tests = ["ha-core/eval-internal-tests"]

[lints]
workspace = true
