[package]
name = "ha-eval-runtime"
version = "0.44.0"
description = "Hope Agent evaluation runtime — coding eval fixture runner, evaluation orchestration store, context retrieval ranking"
license.workspace = true
authors.workspace = true
repository.workspace = true
edition.workspace = true

[features]
# 与 ha-core 同名特性对齐：迁移前 `coding_eval` 的这批重测试就是靠 ha-core 的
# `eval-internal-tests` 开关的，只由本地 `hope-agent-eval` 显式打开，不进 PR 门禁。
eval-internal-tests = ["ha-core/eval-internal-tests"]

[dependencies]
ha-core = { path = "../ha-core" }
ha-improve = { path = "../ha-improve" }
ha-eval-spec = { path = "../ha-eval-spec" }

anyhow = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
ring = "0.17"
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tempfile = "3"
tokio = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }
zip = "7"

[dev-dependencies]
ha-core = { path = "../ha-core", features = ["test-support"] }
# 只在 `#[cfg(test)]` 里用（coding_eval 的 provider 解析冒烟测试起本地 mock server）。
wiremock = "0.6"

[lints]
workspace = true
