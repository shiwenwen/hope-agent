[package]
name = "ha-design"
version = "0.29.0"
description = "Hope Agent design space feature — artifacts store, compile/export pipeline, design/canvas/artifact tools"
license.workspace = true
authors.workspace = true
repository.workspace = true
edition.workspace = true

[dependencies]
ha-base = { path = "../ha-base" }
ha-config-schema = { path = "../ha-config-schema" }
ha-browser = { path = "../ha-browser" }
ha-core = { path = "../ha-core" }
ha-knowledge = { path = "../ha-knowledge" }
ha-media = { path = "../ha-media" }

anyhow = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
dirs = { workspace = true }
futures-util = { workspace = true }
reqwest = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }

# 与 ha-core 原依赖同版本线
chromiumoxide = "0.9"
htmd = "0.5"
pdf-extract = "0.10"
flate2 = "1"
blake3 = "1.8.5"
encoding_rs = "0.8"
image = { version = "0.25", features = ["jpeg", "png", "gif", "webp"] }
notify = "8.2.0"
pulldown-cmark = "0.13.4"
scraper = "0.26.0"
tempfile = "3"
zip = "7"

# oxc：design 空间后端编译 Component 产物（JSX/TSX → JS，浏览器零编译红线）
oxc_allocator = "0.138"
oxc_parser = "0.138"
oxc_span = "0.138"
oxc_semantic = "0.138"
oxc_transformer = "0.138"
oxc_codegen = "0.138"

[lints]
workspace = true
