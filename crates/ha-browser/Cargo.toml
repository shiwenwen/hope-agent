[package]
name = "ha-browser"
version = "0.36.0"
description = "Hope Agent browser feature — Chrome extension backend, CDP backend, broker, browser tool"
license.workspace = true
authors.workspace = true
repository.workspace = true
edition.workspace = true
build = "build.rs"

[dependencies]
ha-base = { path = "../ha-base" }
ha-config-schema = { path = "../ha-config-schema" }
ha-core = { path = "../ha-core" }

anyhow = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
dirs = { workspace = true }
futures-util = { workspace = true }
regex = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true }
tokio-native-tls = "0.3"
url = { workspace = true }
uuid = { workspace = true }

# 与 ha-core 原依赖同版本线
chromiumoxide = "0.9"
image = { version = "0.25", features = ["jpeg", "png", "gif", "webp"] }
rust-embed = { version = "8", features = ["include-exclude"] }
tempfile = "3"
zip = "7"
blake3 = "1.8.5"
libc = "0.2"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

[lints]
workspace = true
