[package]
name = "ha-browser"
version = "0.27.0"
description = "Hope Agent browser feature — Chrome extension backend, CDP backend, broker, browser tool"
license.workspace = true
authors.workspace = true
repository.workspace = true
edition.workspace = true
build = "build.rs"

[dependencies]
ha-base = { path = "../ha-base" }
ha-config-schema = { path = "../ha-config-schema" }
ha-core = { path = "../ha-core" }

anyhow = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
dirs = { workspace = true }
futures-util = { workspace = true }
regex = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }

# 与 ha-core 原依赖同版本线
chromiumoxide = "0.9"
image = { version = "0.25", features = ["jpeg", "png", "gif", "webp"] }
rust-embed = { version = "8", features = ["include-exclude"] }
tempfile = "3"
zip = "7"
blake3 = "1.8.5"
libc = "0.2"

[lints]
workspace = true
